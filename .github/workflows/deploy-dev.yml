name: Deploy Development

# Auto-deploy to the development stack on every push to beta.
# Uses the shared template with EnvironmentName=dev (separate stack).

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  STACK_NAME: multi-env-dev
  ENVIRONMENT: dev

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to development
    needs: test
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub environment config
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN is empty. Add it as an Environment variable (not a secret) under Settings → Environments → development."
            exit 1
          fi
          if [ -z "$AWS_REGION" ]; then
            echo "::error::AWS_REGION is empty. Add it as a Repository variable under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_ROLE_ARN=$AWS_ROLE_ARN"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-dev

      - name: SAM build
        run: sam build --template template.yaml

      - name: SAM deploy (dev)
        run: |
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT}"

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs' \
            --output table
