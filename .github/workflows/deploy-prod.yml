name: Deploy Production

# Production deploys from beta (or manual dispatch) and go through the
# GitHub "production" environment — enable required reviewers there so humans
# approve before the same application code reaches the prod stack.

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: multi-env-prod
  ENVIRONMENT: prod

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    # Gate: Settings → Environments → production → Required reviewers
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # Prefer OIDC when AWS_ROLE_TO_ASSUME is set on the environment:
          # role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: SAM build
        run: sam build --template template.yaml

      - name: SAM deploy (prod)
        run: |
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT}"

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs' \
            --output table
