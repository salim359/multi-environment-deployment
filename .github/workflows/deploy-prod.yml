name: Deploy Production

# Production deploys from beta (or manual dispatch) and go through the
# GitHub "production" environment — enable required reviewers there so humans
# approve before the same application code reaches the prod stack.

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  STACK_NAME: multi-env-prod
  ENVIRONMENT: prod

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub environment config
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::vars.AWS_ROLE_ARN is empty. Job must use environment: production, and that env must have variable AWS_ROLE_ARN."
            exit 1
          fi
          if [ -z "$AWS_REGION" ]; then
            echo "::error::AWS_REGION is empty. Add repository variable AWS_REGION (e.g. us-east-1)."
            exit 1
          fi
          echo "AWS_REGION=$AWS_REGION"
          echo "Role ARN=$AWS_ROLE_ARN"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-prod

      - name: SAM build
        run: sam build --template template.yaml

      - name: SAM deploy (prod)
        run: |
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              "EnvironmentName=${ENVIRONMENT}"

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs' \
            --output table
